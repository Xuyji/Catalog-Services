dependencies {
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.14.0'
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation('software.amazon.awssdk:s3') {
        // Lambda: use the lighter URL-connection HTTP client instead of Apache + Netty.
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

// Deployment package in the layout AWS Lambda expects: classes at the root, dependencies in lib/.
tasks.register('buildZip', Zip) {
    archiveFileName = 'catalog-ingest-lambda.zip'
    from compileJava
    from processResources
    into('lib') {
        from configurations.runtimeClasspath
    }
}

tasks.named('build') { dependsOn 'buildZip' }
