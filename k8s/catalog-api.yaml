apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels: { app: catalog-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: catalog-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: catalog-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: catalog-api
          image: ghcr.io/YOUR_GITHUB_USER/catalog-api:1.0.0
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: CASSANDRA_CONTACT_POINTS, value: "cassandra.cassandra.svc:9042" }
            - { name: CASSANDRA_LOCAL_DC, value: "datacenter1" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }  # give the load balancer time to drain
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
spec:
  selector: { app: catalog-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: catalog-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
