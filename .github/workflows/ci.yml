name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Build images
        run: |
          docker build -t charts-api:${{ github.sha }} charts-api
          docker build -t catalog-api:${{ github.sha }} catalog-api
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-ingest-lambda
          path: catalog-ingest-lambda/build/distributions/catalog-ingest-lambda.zip
